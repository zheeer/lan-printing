name: Build Windows XP x86 EXE

on:
  push:
    branches:
      - "xp-compat-34"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install portable Python 3.4 x86
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/FuturisticGoo/portable_python/main/py_distros/python_3.4_wpsw.zip" -OutFile "$env:TEMP\python34.zip"
          7z x "$env:TEMP\python34.zip" -opy34 -y | Out-Null
          $py = Get-ChildItem ".\py34" -Recurse -Filter "python.exe" | Select-Object -First 1
          if ($null -eq $py) { 7z l "$env:TEMP\python34.zip"; throw "Portable Python 3.4 extraction failed: python.exe not found" }
          $py34 = $py.FullName
          & $py34 --version
          & $py34 -c "import struct,sys; b=open(sys.executable,'rb').read(); pe=struct.unpack_from('<I',b,0x3c)[0]; print('Python machine=',hex(struct.unpack_from('<H',b,pe+4)[0]))"
          Set-Content -Path py34_path.txt -Value $py34

      - name: Bootstrap pip and install XP-era dependencies
        shell: powershell
        run: |
          $py34 = Get-Content py34_path.txt
          & $py34 -m pip install --upgrade "pip==19.1.1" "setuptools==40.8.0" "wheel==0.34.2"
          & $py34 -m pip install --no-deps "pypiwin32==219" "WMI==1.5.1"
          & $py34 -m pip install "future-fstrings==1.2.0" "PyInstaller==3.4" "pefile==2019.4.18" "flask==1.0.4" "flask-cors==3.0.10" "werkzeug==0.16.1" "requests==2.21.0" "requests-toolbelt==0.9.1" "pystray==0.14.4" "Pillow==5.4.1" "comtypes==1.1.7" "waitress==1.3.1" "certifi==2020.6.20" "chardet==3.0.4" "pdf2image==1.7.0" "parse==1.20.1" "pyasn1==0.4.8" "urllib3==1.24.3" "idna==2.8" "six==1.15.0"
          & $py34 -c "import parse, flask, PIL, win32print, comtypes, wmi, pdf2image, pystray; print('XP dependency import check: OK')"

      - name: Extract Poppler
        shell: cmd
        run: |
          7z x poppler.rar -y
          if not exist "poppler\Library\bin" (
            echo ERROR: poppler\Library\bin was not found after extraction.
            exit /b 1
          )

      - name: Build EXE
        shell: powershell
        run: |
          $py34 = Get-Content py34_path.txt
          & $py34 -m PyInstaller --clean --noconfirm print_server2.6.spec


      - name: Package
        shell: powershell
        run: |
          Compress-Archive -Path "dist\print_server2.6\*" -DestinationPath "lan-printing-2.6-XP-legacy-x86.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-printing-2.6-XP-legacy-x86
          path: lan-printing-2.6-XP-legacy-x86.zip
          if-no-files-found: error

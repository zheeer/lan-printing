name: Build Windows XP x64 EXE

on:
  push:
    branches:
      - "xp-compat-34"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python 3.4.4 x64
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://mirrors.huaweicloud.com/python/3.4.4/python-3.4.4.amd64.msi" -OutFile "$env:TEMP\python34.msi"
          Start-Process msiexec.exe -ArgumentList '/a "$env:TEMP\python34.msi" /qn TARGETDIR="$PWD\py34"' -Wait -NoNewWindow
          if (!(Test-Path ".\py34\python.exe")) { throw "Python 3.4.4 extraction failed" }
          .\py34\python.exe --version

      - name: Bootstrap pip and install XP-era dependencies
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/pip/3.4/get-pip.py" -OutFile "get-pip.py"
          .\py34\python.exe get-pip.py "pip==19.1.1" "setuptools==44.1.1" "wheel==0.34.2"
          .\py34\python.exe -m pip install "future-fstrings==1.2.0" "PyInstaller==3.4" "flask==1.0.4" "flask-cors==3.0.10" "werkzeug==0.16.1" "requests==2.21.0" "requests-toolbelt==0.9.1" "pysnmp==4.4.12" "pystray==0.14.4" "Pillow==5.4.1" "comtypes==1.1.7" "pypiwin32==219" "WMI==1.5.1" "waitress==1.3.1" "certifi==2020.6.20" "chardet==3.0.4" "pdf2image==1.7.0" "parse==1.20.1" "pyasn1==0.4.8" "pycryptodomex==3.9.8" "urllib3==1.24.3" "idna==2.8" "six==1.15.0"
          .\py34\python.exe -c "import parse, flask, PIL, win32print, comtypes, wmi, pdf2image, pystray; print('XP dependency import check: OK')"

      - name: Extract Poppler
        shell: cmd
        run: |
          7z x poppler.rar -y
          if not exist "poppler\Library\bin" (
            echo ERROR: poppler\Library\bin was not found after extraction.
            exit /b 1
          )

      - name: Build EXE
        shell: cmd
        run: |
          .\py34\python.exe -m PyInstaller --clean --noconfirm print_server2.6.spec

      - name: Verify PE minimum OS and architecture
        shell: powershell
        run: |
          .\py34\python.exe -c "import struct; p='dist\\print_server2.6\\print_server2.6.exe'; b=open(p,'rb').read(); pe=struct.unpack_from('<I',b,0x3c)[0]; o=pe+24; m=struct.unpack_from('<H',b,o)[0]; machine=struct.unpack_from('<H',b,pe+4)[0]; osver=struct.unpack_from('<HH',b,o+40); print('EXE machine=',hex(machine),'PE=',hex(m),'minimum OS=',osver); assert osver[0]==5 and osver[1] in (1,2), 'EXE minimum OS is not XP-compatible'

      - name: Package
        shell: powershell
        run: |
          Compress-Archive -Path "dist\print_server2.6\*" -DestinationPath "lan-printing-2.6-XP-legacy-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-printing-2.6-XP-legacy-x64
          path: lan-printing-2.6-XP-legacy-x64.zip
          if-no-files-found: error

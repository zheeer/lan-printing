name: Windows EXE Build

on:
  push:
    branches: ["2.6"]
    paths:
      - "print_server2.6.py"
      - "print_server2.6.spec"
      - "poppler.rar"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.7.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.7.9"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade "pip<24.1" setuptools wheel
          python -m pip install flask flask-cors werkzeug requests requests-toolbelt pysnmp pystray pillow comtypes pywin32 wmi waitress certifi chardet pdf2image pyinstaller==5.13.2

      - name: Extract Poppler
        shell: cmd
        run: |
          if not exist poppler mkdir poppler
          7z x poppler.rar -opoppler -y

      - name: Build EXE
        shell: cmd
        run: |
          pyinstaller --clean --noconfirm print_server2.6.spec

      - name: Package
        shell: powershell
        run: |
          Compress-Archive -Path dist\print_server2.6\* -DestinationPath print_server2.6-win64-xp-upload-fix.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: print_server2.6-win64-xp-upload-fix
          path: print_server2.6-win64-xp-upload-fix.zip
          if-no-files-found: error
